services:
  db:
    image: postgres:16-alpine
    container_name: secdocs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secdocs_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-secdocs}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Aplica 001_init.sql automáticamente al crear el volumen pgdata
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
